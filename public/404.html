<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Instant redirect for Vercel - prevents 404 flash
        // Vercel's vercel.json rewrite should handle this, but this is a fallback
        (function() {
            var path = window.location.pathname;
            window.location.replace(path);
        })();
    </script>
    <style>
        body { margin: 0; background: #f9fafb; }
    </style>
</head>
<body></body>
</html>
